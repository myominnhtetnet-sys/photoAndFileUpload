<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Registered User Profile</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link th:href="@{/css/style2.css}" rel="stylesheet">
</head>
<body>

<div class="container mt-5">
    <div class="card p-4 shadow" style="max-width: 500px; margin: auto;">
        <h2>Registered User Profile</h2>

        <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <span th:text="${errorMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <div class="my-3 text-center" th:if="${user.base64Photo != null}">
            <img th:src="'data:image/png;base64,' + ${user.base64Photo}" 
                 class="img-thumbnail" style="width: 150px; height: 150px; object-fit: cover;" alt="User Photo"/>
        </div>

        <p><strong>Username:</strong> <span th:text="${user.name}"></span></p>
        <p><strong>Email:</strong> <span th:text="${user.email}"></span></p>
        <p><strong>Age:</strong> <span th:text="${user.age}"></span></p>

        <div class="mt-4 d-flex gap-2">
            <a th:href="@{/users}" class="btn btn-success">View All Users</a>
            <!-- Edit Profile Button -->
            <button type="button" class="btn btn-warning" 
                    data-bs-toggle="modal" data-bs-target="#editUserModal" 
                    th:data-id="${user.id}">Edit Profile</button>
        </div>
    </div>
</div>

<!-- Edit Profile Modal Box -->
<div class="modal fade" id="editUserModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <form id="updateForm" th:action="@{/user/update}" method="post" enctype="multipart/form-data">
                <div class="modal-header">
                    <h5 class="modal-title">Edit Profile</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="editId" name="id">

                    <div class="mb-3">
                        <label for="editName" class="form-label">UserName</label>
                        <input type="text" class="form-control" id="editName" name="name" required>
                    </div>

                    <div class="mb-3">
                        <label for="editEmail" class="form-label">Email</label>
                        <input type="email" class="form-control" id="editEmail" name="email" readonly>
                    </div>

                    <div class="mb-3">
                        <label for="editPassword" class="form-label">Password</label>
                        <input type="password" class="form-control" id="editPassword" name="password" required>
                    </div>

                    <div class="mb-3">
                        <label for="editAge" class="form-label">Age</label>
                        <input type="number" class="form-control" id="editAge" name="age" required>
                    </div>

                    <!-- 📸 Photo Preview & Input Section -->
                    <div class="mb-3">
                        <label class="form-label d-block">Current / Selected Photo</label>
                        <div class="text-center mb-2">
                            <img id="editPhotoPreview" src="" class="img-thumbnail" 
                                 style="width: 120px; height: 120px; object-fit: cover; display: none;" alt="User Photo">
                        </div>
                        
                        <label for="editPhoto" class="form-label">Change Photo (Optional)</label>
                        <input type="file" class="form-control" id="editPhoto" name="photo" accept="image/*">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
// Modal ပွင့်လာပါက Data ဖြည့်သွင်းခြင်း
const editUserModal = document.getElementById('editUserModal');
if (editUserModal) {
    editUserModal.addEventListener('show.bs.modal', function(event) {
        const button = event.relatedTarget;
        const userId = button.getAttribute('data-id');

        fetch(`/user/edit/${userId}`)
            .then(response => {
                if (!response.ok) throw new Error('Failed to fetch user data');
                return response.json();
            })
            .then(user => {
                document.getElementById('editId').value = user.id;
                document.getElementById('editName').value = user.name;
                document.getElementById('editEmail').value = user.email;
                document.getElementById('editPassword').value = user.password;
                document.getElementById('editAge').value = user.age;
                
                const editPhotoInput = document.getElementById('editPhoto');
                if (editPhotoInput) editPhotoInput.value = '';

                const imgPreview = document.getElementById('editPhotoPreview');
                if (user.base64Photo) {
                    imgPreview.src = 'data:image/png;base64,' + user.base64Photo;
                    imgPreview.style.display = 'inline-block';
                } else {
                    imgPreview.style.display = 'none';
                }
            })
            .catch(error => console.error('Error fetching user:', error));
    });
}

// Photo Input ရွေးချယ်မှု စစ်ဆေးခြင်းနှင့် Preview ပြသခြင်း
document.getElementById('editPhoto')?.addEventListener('change', function(event) {
    const fileInput = event.target;
    const file = fileInput.files[0];
    const imgPreview = document.getElementById('editPhotoPreview');

    if (file) {
        const validImageTypes = ['image/jpeg', 'image/png', 'image/gif', 'image/webp'];
        if (!validImageTypes.includes(file.type)) {
            alert('ဓာတ်ပုံ (JPG, PNG, GIF, WEBP) ဖိုင်များကိုသာ တင်ခွင့်ရှိပါသည်။');
            fileInput.value = ''; 
            return;
        }

        const reader = new FileReader();
        reader.onload = function(e) {
            imgPreview.src = e.target.result;
            imgPreview.style.display = 'inline-block';
        };
        reader.readAsDataURL(file);
    }
});
</script>
</body>
</html>
