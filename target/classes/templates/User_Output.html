<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Registered User Profile</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">
    <div class="card p-4 shadow" style="max-width: 500px; margin: auto;">
        <h2>Registered User Profile</h2>

        <div class="my-3 text-center" th:if="${user.base64Photo != null}">
            <img th:src="'data:image/png;base64,' + ${user.base64Photo}" 
                 class="img-thumbnail" style="width: 150px; height: 150px; object-fit: cover;" alt="User Photo"/>
        </div>

        <p><strong>Username:</strong> <span th:text="${user.name}"></span></p>
        <p><strong>Email:</strong> <span th:text="${user.email}"></span></p>
        <p><strong>Age:</strong> <span th:text="${user.age}"></span></p>

        <div class="mt-4 d-flex gap-2">
            <a th:href="@{/users}" class="btn btn-success">View All Users</a>
            <!-- Edit Profile Button -->
            <button type="button" class="btn btn-warning" 
                    data-bs-toggle="modal" data-bs-target="#editUserModal" 
                    th:data-id="${user.id}">Edit Profile</button>
        </div>
    </div>
</div>

<!-- Edit Profile Modal Box -->
<div class="modal fade" id="editUserModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <form th:action="@{/user/update}" method="post" enctype="multipart/form-data">
                <div class="modal-header">
                    <h5 class="modal-title">Edit Profile</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="editId" name="id">

                    <div class="mb-3">
                        <label for="editName" class="form-label">UserName</label>
                        <input type="text" class="form-control" id="editName" name="name" required>
                    </div>

                    <div class="mb-3">
                        <label for="editEmail" class="form-label">Email</label>
                        <input type="email" class="form-control" id="editEmail" name="email" readonly>
                    </div>

                    <div class="mb-3">
                        <label for="editPassword" class="form-label">Password</label>
                        <input type="password" class="form-control" id="editPassword" name="password" required>
                    </div>

                    <div class="mb-3">
                        <label for="editAge" class="form-label">Age</label>
                        <input type="number" class="form-control" id="editAge" name="age" required>
                    </div>

                    <div class="mb-3">
                        <label for="editPhoto" class="form-label">Change Photo (Optional)</label>
                        <input type="file" class="form-control" id="editPhoto" name="photo" accept="image/*">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="text/javascript" th:src="@{/js/fa.js}"></script>
</body>
</html>
