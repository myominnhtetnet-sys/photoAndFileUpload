<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registration</title>
<link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
<link th:href="@{/css/u.css}" rel="stylesheet">
</head>
<body>

<div class="register-container">
    <h2>Register Form</h2>
    
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show mb-3" role="alert">
        <span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <form th:action="@{/userUpload}" th:object="${userObj}" method="post" enctype="multipart/form-data">
    
        <div style="text-align: center; margin-bottom: 15px;">
            <img id="photoPreview" src="" 
                 style="width: 110px; height: 110px; object-fit: cover; display: none;" 
                 alt="Selected Photo Preview">
        </div>

        <div>
            <label for="username">Username</label>
            <input type="text" id="username" th:field="*{name}" placeholder="Enter your username" required>
        </div>

        <div>
            <label for="email">Email</label>
            <input type="email" id="email" th:field="*{email}" pattern="[a-z_]+([a-z0-9_]+)*@gmail\.com" placeholder="example@gmail.com" required>
        </div>

        <div>
            <label for="age">Age</label>
            <input type="number" id="age" th:field="*{age}" placeholder="Enter age" required>
        </div>

        <div>
            <label for="password">Password</label>
            <input type="password" id="password" th:field="*{password}" placeholder="Enter password" required>
        </div>

        <div>
            <label for="photo">Photo (Max: 1 MB)</label>
            <input type="file" id="photo" th:field="*{photo}" accept="image/png, image/jpeg, image/jpg, image/gif, image/webp" required>
        </div>

        <button type="submit" class="btn-submit">Register</button>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/u.js}"></script>

</body>
</html>
