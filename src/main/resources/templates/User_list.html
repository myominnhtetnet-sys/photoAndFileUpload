<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>User Registration List</title>
<link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
<link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>

<div class="container" style="margin-top: 5%; margin-bottom: 5%;">
    <h2>User List</h2>
    <table class="table table-bordered table-striped mt-3 align-middle">
        <thead class="table-dark">
            <tr>
                <th>No</th>
                <th>UserName</th>
                <th>Email</th>
                <th>Password</th>
                <th>Age</th>
                <th>Photo</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="user, index : ${users}">
                <td th:text="${index.count}"></td>
                <td th:text="${user.name}"></td>
                <td th:text="${user.email}"></td>
                <td th:text="${user.password}"></td> 
                <td th:text="${user.age}"></td>
                <td>
                    <!-- Base64 Image တိုက်ရိုက်ပြသခြင်း -->
                    <img th:if="${user.base64Photo != null}" 
                         th:src="'data:image/png;base64,' + ${user.base64Photo}" 
                         style="width: 60px; height: 60px; object-fit: cover; border-radius: 5px;"/>
                    <span th:if="${user.base64Photo == null}">No Image</span>
                </td>
                <td>
                    <!-- Delete Button သာ ချန်ထားပါသည် -->
                    <form th:action="@{/user/delete/{id}(id=${user.id})}" method="post" style="display:inline;">
                        <button type="submit" class="btn btn-danger btn-sm" 
                                onclick="return confirm('Do you want to delete this user?');">Delete</button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>
</div>

</body>
</html>
