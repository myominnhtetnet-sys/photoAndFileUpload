<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Directory</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/u_l.css}" rel="stylesheet">
</head>
<body>

<div class="main-container py-4">
    <!-- Header Section -->
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3 class="fw-bold mb-0 text-slate">User Directory</h3>
        <a th:href="@{/user}" class="btn btn-primary btn-add-user">
            + Add New User
        </a>
    </div>

    <!-- Data Table Card -->
    <div class="dashboard-card">
        <div class="table-responsive">
            <table class="table custom-table align-middle">
                <thead>
                    <tr>
                        <th class="text-center col-no">NO</th>
                        <th class="col-info">USER INFO</th>
                        <th class="text-center col-photo">PHOTO</th>
                        <th class="text-center col-action">ACTIONS</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="user, stat : ${users}" class="clickable-row" th:data-id="${user.id}">
                        <td class="text-center fw-semibold text-muted" th:text="${stat.count}">1</td>
                        <td>
                            <div class="d-flex align-items-center">
                                <span class="fw-bold text-dark me-2" th:text="${user.name}"></span>
                                <span th:if="${stat.first}" class="badge badge-new">NEW</span>
                            </div>
                        </td>
                        <td class="text-center">
                            <img th:if="${user.base64Photo != null}" 
                                 th:src="'data:image/png;base64,' + ${user.base64Photo}" 
                                 class="avatar-img" alt="User Photo">
                            <img th:if="${user.base64Photo == null}" 
                                 src="https://api.dicebear.com/7.x/bottts/svg?seed=default" 
                                 class="avatar-img" alt="Default Photo">
                        </td>
                        <td class="text-center" onclick="event.stopPropagation();">
                            <form th:action="@{/user/delete/{id}(id=${user.id})}" method="post" onsubmit="return confirm('Are you sure you want to delete this user?');">
                                <button type="submit" class="btn btn-outline-danger btn-sm rounded-2 px-3">Delete</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Modal Component -->
<div class="modal fade" id="profileModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header text-white">
                <h5 class="modal-title fw-bold">User Profile Detail</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body text-center p-4">
                <img id="modalUserPhoto" src="" class="avatar-img mb-3 shadow-sm" style="width: 90px; height: 90px; border-width: 3px;" alt="User Photo">
                
                <h4 id="modalUserName" class="fw-bold text-dark mb-1"></h4>
                <p id="modalUserEmail" class="text-muted mb-4"></p>
                
                <div class="profile-card-detail p-3 text-start">
                    <div class="d-flex justify-content-between mb-2">
                        <span class="text-muted">User ID:</span>
                        <span id="modalUserId" class="fw-semibold"></span>
                    </div>
                    <div class="d-flex justify-content-between mb-2">
                        <span class="text-muted">Age:</span>
                        <span id="modalUserAge" class="fw-semibold"></span>
                    </div>
                    <div class="d-flex justify-content-between">
                        <span class="text-muted">Password:</span>
                        <span id="modalUserPassword" class="fw-semibold text-danger">••••••••</span>
                    </div>
                </div>
            </div>
            <div class="modal-footer border-0 bg-light">
                <button type="button" class="btn btn-secondary rounded-3 px-4" data-bs-dismiss="modal">Close</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="text/javascript" th:src="@{/js/u_l.js}"></script>

</body>
</html>
