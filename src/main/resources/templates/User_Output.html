<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registered Profile</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link th:href="@{/css/u_o.css}" rel="stylesheet">
</head>
<body>

<div class="container py-5">
    <div class="card p-4 shadow-lg mx-auto" style="max-width: 480px;">
        <h2>Registered Profile</h2>

        <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show my-2" role="alert">
            <span th:text="${errorMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <div class="my-3 text-center">
            <img th:if="${user.base64Photo != null}" 
                 th:src="'data:image/png;base64,' + ${user.base64Photo}" 
                 class="img-thumbnail" style="width: 140px; height: 140px; object-fit: cover;" alt="User Photo"/>
            <img th:if="${user.base64Photo == null}" 
                 src="https://api.dicebear.com/7.x/bottts/svg?seed=default" 
                 class="img-thumbnail" style="width: 140px; height: 140px; object-fit: cover;" alt="Default Photo"/>
        </div>

        <div class="profile-details">
            <p><strong>Username</strong> <span th:text="${user.name}"></span></p>
            <p><strong>Email</strong> <span th:text="${user.email}"></span></p>
            <p><strong>Age</strong> <span th:text="${user.age}"></span></p>
        </div>

        <div class="mt-4 d-flex gap-2">
            <a th:href="@{/users}" class="btn btn-success w-100">View All Users</a>
            <button type="button" class="btn btn-warning w-100 text-white" 
                    data-bs-toggle="modal" data-bs-target="#editUserModal" 
                    th:data-id="${user.id}">Edit Profile</button>
        </div>
    </div>
</div>

<div class="modal fade" id="editUserModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <form id="updateForm" th:action="@{/user/update}" method="post" enctype="multipart/form-data">
                <div class="modal-header">
                    <h5 class="modal-title">Edit Profile</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="editId" name="id">
                    
                    <div class="text-center mb-3">
                        <img id="editPhotoPreview" src="" class="img-thumbnail" 
                             style="width: 110px; height: 110px; object-fit: cover; display: none;" alt="User Photo Preview">
                    </div>

                    <div class="mb-3">
                        <label for="editName" class="form-label">Username</label>
                        <input type="text" class="form-control" id="editName" name="name" required>
                    </div>

                    <div class="mb-3">
                        <label for="editEmail" class="form-label">Email (Read-only)</label>
                        <input type="email" class="form-control" id="editEmail" name="email" readonly>
                    </div>

                    <div class="mb-3">
                        <label for="editPassword" class="form-label">Password (Read-only)</label>
                        <input type="password" class="form-control" id="editPassword" name="password" readonly>
                    </div>

                    <div class="mb-3">
                        <label for="editAge" class="form-label">Age</label>
                        <input type="number" class="form-control" id="editAge" name="age" required>
                    </div>

                    <div class="mb-3">
                        <label for="editPhoto" class="form-label">Change Photo (Max: 1 MB)</label>
                        <input type="file" class="form-control" id="editPhoto" name="photo" accept="image/png, image/jpeg, image/jpg, image/gif, image/webp">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary px-3" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary px-4">Save Changes</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="text/javascript" th:src="@{/js/uo.js}"></script>
</body>
</html>
